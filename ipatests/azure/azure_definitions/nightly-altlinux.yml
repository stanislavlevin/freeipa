default_resources:
  server:
    mem_limit: "2000m"
    memswap_limit: "2700m"
    mem_reservation: "1600m"
  replica:
    mem_limit: "1800m"
    memswap_limit: "2500m"
    mem_reservation: "1500m"
  client:
    mem_limit: "512m"
    memswap_limit: "1000m"
    mem_reservation: "410m"

vms:
- vm_jobs:
  - container_job: nfs
    containers:
      clients: 3
    tests:
    - test_integration/test_nfs.py

  - container_job: ntp_options_common
    tests:
    - test_integration/test_ntp_options.py::TestNTPoptionsCommon
    containers:
      replicas: 1
      clients: 1

- vm_jobs:
  - container_job: otp
    tests:
    - test_integration/test_otp.py

- vm_jobs:
  - container_job: ntp_options_chrony
    tests:
    - test_integration/test_ntp_options.py::TestNTPoptions
    args: '-k chrony'
    containers:
      replicas: 1
      clients: 1

  - container_job: ntp_options_ntpd
    tests:
    - test_integration/test_ntp_options.py::TestNTPoptions
    args: '-k "ntpd and not openntpd"'
    containers:
      replicas: 1
      clients: 1

  - container_job: ntp_options_openntpd
    tests:
    - test_integration/test_ntp_options.py::TestNTPoptions
    args: '-k openntpd'
    containers:
      replicas: 1
      clients: 1

  - container_job: ntp_nooptions
